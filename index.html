<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥤 飲料團購</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: #f5f6f8; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; }
    .container { max-width: 900px; margin: auto; }
    .card { background: #fff; border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    h1 { margin: 0; font-size: 28px; }
    h2 { margin: 0 0 14px; font-size: 20px; }
    .subtitle { margin-top: 6px; color: #777; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .field { flex: 1; min-width: 180px; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; background: white; }
    textarea { min-height: 120px; }
    button { border: 0; border-radius: 10px; padding: 11px 15px; background: #222; color: white; font-size: 15px; cursor: pointer; }
    button:hover { opacity: .9; }
    button.green { background: #2e8b57; }
    button.red { background: #d9534f; }
    button.blue { background: #3976cf; }
    button.gray { background: #eee; color: #333; }
    button.small { padding: 7px 10px; font-size: 13px; }
    button.full { width: 100%; }
    .hidden { display: none !important; }

    .status { display: inline-block; margin-top: 15px; padding: 7px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; }
    .status.open { background: #e5f7ed; color: #21834b; }
    .status.closed { background: #fbe7e7; color: #b33c3c; }
    .admin { border: 2px dashed #ddd; }
    .notice { padding: 12px; border-radius: 10px; background: #fff7dc; border: 1px solid #f0dc94; color: #735d00; font-size: 13px; line-height: 1.7; }
    .success { padding: 12px; border-radius: 10px; background: #eaf8ef; border: 1px solid #b9e4c7; color: #25733f; font-size: 13px; }

    .menu-preview { width: 100%; max-height: 350px; object-fit: contain; margin-top: 12px; border-radius: 12px; background: #f4f4f4; display: none; }
    .people-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .person-btn { background: #f1f3f5; color: #333; border: 1px solid #ddd; }
    .person-btn.selected { background: #222; color: white; }
    .category-editor { border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .category-header { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .drink-editor { display: grid; grid-template-columns: 1fr 75px 75px 42px; gap: 6px; margin-bottom: 7px; }
    .drink-editor input { padding: 8px; font-size: 14px; }
    .order-person { padding: 13px 0; border-bottom: 1px solid #eee; }
    .person-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; }
    .order-item { margin-top: 8px; padding: 10px; background: #f8f8f8; border-radius: 10px; font-size: 14px; line-height: 1.7; }
    .price { font-weight: 700; white-space: nowrap; }
    .total-box { margin-top: 15px; padding: 18px; background: #222; color: white; border-radius: 14px; }
    .total-number { font-size: 30px; font-weight: 700; }
    .toast { position: fixed; left: 50%; bottom: 25px; transform: translateX(-50%); background: #222; color: white; padding: 12px 18px; border-radius: 30px; font-size: 14px; z-index: 9999; opacity: 0; pointer-events: none; transition: .25s; }
    .toast.show { opacity: 1; }

    @media(max-width:600px) {
      body { padding: 8px; }
      .card { padding: 14px; }
      .drink-editor { grid-template-columns: 1fr 60px 60px 38px; }
    }
  </style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1>🥤 飲料團購</h1>
    <div class="subtitle">今天一起訂飲料</div>
    <div style="height:15px;"></div>
    <div class="row">
      <div class="field">
        <label>店家</label>
        <input id="shopName" placeholder="例如：得正">
      </div>
      <div class="field">
        <label>日期</label>
        <input id="orderDate" type="date">
      </div>
    </div>
    <div id="statusBadge" class="status open">● 訂購中</div>
  </div>

  <!-- 管理區 -->
  <div class="card admin">
    <h2>⚙️ 管理區</h2>
    
    <div class="field" style="margin-bottom: 12px;">
      <label>Gemini API Key (AI 辨識必填)</label>
      <input id="apiKeyInput" type="password" placeholder="請輸入 AIZASy..." onchange="saveApiKey()">
    </div>

    <label>上傳今日菜單照片</label>
    <div class="row">
      <div class="field">
        <input id="menuImage" type="file" accept="image/*" onchange="previewImage(event)">
      </div>
      <button class="blue" onclick="runGeminiOCR()">🤖 AI 自動辨識並產生菜單</button>
      <button class="green" onclick="publishMenu()">📤 發布今日菜單</button>
    </div>

    <img id="menuPreview" class="menu-preview">
    <div id="ocrStatus" class="success hidden" style="margin-top:12px;"></div>

    <div style="height:12px;"></div>
    <button class="gray" onclick="toggleEditor()">✏️ 檢視 / 編輯菜單資料</button>

    <div id="menuEditor" class="hidden" style="margin-top:15px;">
      <div id="editorContainer"></div>
      <div class="row">
        <button class="gray" onclick="addCategory()">＋ 新增分類</button>
        <button class="green" onclick="publishMenu()">💾 儲存並發布</button>
      </div>
    </div>

    <div style="height:15px;"></div>
    <div class="row">
      <button class="green" onclick="setOrderStatus(true)">🔓 開始訂購</button>
      <button class="red" onclick="setOrderStatus(false)">🔒 關閉訂購</button>
    </div>
  </div>

  <!-- 訂購人 -->
  <div class="card">
    <h2>👥 誰要喝？</h2>
    <div class="people-list" id="peopleList"></div>
    <div style="height:12px;"></div>
    <div class="row">
      <div class="field">
        <input id="newPerson" placeholder="輸入同事姓名">
      </div>
      <button onclick="addPerson()">＋ 新增</button>
    </div>
  </div>

  <!-- 點餐區 -->
  <div class="card">
    <h2>🧋 我要點飲料</h2>
    <div id="closedMessage" class="notice hidden">🔒 目前已關閉訂購。</div>
    <div id="orderForm">
      <div class="field">
        <label>飲料</label>
        <select id="drinkSelect"></select>
      </div>
      <div style="height:10px;"></div>
      <div class="row">
        <div class="field">
          <label>大小</label>
          <select id="sizeSelect"><option value="M">M</option><option value="L">L</option></select>
        </div>
        <div class="field">
          <label>甜度</label>
          <select id="sugarSelect">
            <option>正常糖</option><option>少糖</option><option>半糖</option><option>微糖</option><option>無糖</option>
          </select>
        </div>
        <div class="field">
          <label>冰量</label>
          <select id="iceSelect">
            <option>正常冰</option><option>少冰</option><option>微冰</option><option>去冰</option><option>溫</option><option>熱</option>
          </select>
        </div>
      </div>
      <div style="height:12px;"></div>
      <label>加料</label>
      <div id="toppingList" class="people-list"></div>
      <div style="height:15px;"></div>
      <div style="background:#fafafa;padding:14px;border-radius:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong>本杯金額</strong>
          <span id="currentPrice" class="price">$0</span>
        </div>
        <div style="height:10px;"></div>
        <button class="green full" onclick="addOrder()">🛒 加入我的訂單</button>
      </div>
    </div>
  </div>

  <!-- 今日訂單 -->
  <div class="card">
    <h2>📋 今日訂單</h2>
    <div id="ordersContainer"></div>
    <div class="total-box">
      <div>目前總金額</div>
      <div id="totalAmount" class="total-number">$0</div>
      <div style="height:12px;"></div>
      <button class="full" onclick="generateLineMessage()">📋 產生 LINE 訂單訊息</button>
    </div>
  </div>

  <!-- LINE 輸出 -->
  <div class="card">
    <h2>💬 LINE 訂單訊息</h2>
    <textarea id="lineMessage" readonly placeholder="產生後可以直接複製貼到 LINE"></textarea>
    <div style="height:10px;"></div>
    <button class="blue full" onclick="copyLineMessage()">📋 複製訊息</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const DATABASE_URL = "https://my-family-calendar-219bb-default-rtdb.firebaseio.com";
let currentDate = "";
let data = { shopName: "", isOpen: true, menu: [], orders: {} };
let people = ["Alice", "Bob", "Charlie"];
let selectedName = "";
let selectedToppings = [];

const toppings = [
  { name: "珍珠", price: 10 }, { name: "仙草凍", price: 10 },
  { name: "綠茶凍", price: 10 }, { name: "粉粿", price: 15 }
];

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2000);
}

function saveApiKey() {
  localStorage.setItem("gemini_api_key", document.getElementById("apiKeyInput").value.trim());
}

document.addEventListener("DOMContentLoaded", async function() {
  const today = new Date();
  currentDate = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
  document.getElementById("orderDate").value = currentDate;
  
  const savedKey = localStorage.getItem("gemini_api_key");
  if(savedKey) document.getElementById("apiKeyInput").value = savedKey;

  document.getElementById("drinkSelect").addEventListener("change", updatePrice);
  document.getElementById("sizeSelect").addEventListener("change", updatePrice);

  renderToppings();
  await loadToday();
  startSync();
});

/* Firebase API */
function dbUrl(path) { return DATABASE_URL + "/" + path + ".json"; }
async function dbGet(path) { return (await fetch(dbUrl(path), { cache: "no-store" })).json(); }
async function dbPatch(path, val) { return (await fetch(dbUrl(path), { method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify(val) })).json(); }
async function dbPut(path, val) { return (await fetch(dbUrl(path), { method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(val) })).json(); }

async function loadToday() {
  const result = await dbGet("drinkOrders/" + currentDate);
  if (result) {
    data.shopName = result.shopName || "";
    data.isOpen = result.isOpen !== false;
    data.menu = result.menu || [];
    data.orders = result.orders || {};
  }
  document.getElementById("shopName").value = data.shopName;
  renderAll();
}

function startSync() {
  setInterval(async () => {
    const res = await dbGet("drinkOrders/" + currentDate + "/orders");
    data.orders = res || {};
    renderOrders();
  }, 4000);
}

/* AI Gemini 辨識與結構化 */
async function runGeminiOCR() {
  const apiKey = document.getElementById("apiKeyInput").value.trim();
  const fileInput = document.getElementById("menuImage");
  const file = fileInput.files[0];

  if (!apiKey) { alert("請先輸入 Gemini API Key！"); return; }
  if (!file) { alert("請上傳菜單照片！"); return; }

  const status = document.getElementById("ocrStatus");
  status.classList.remove("hidden");
  status.textContent = "🤖 AI 正在精準讀取菜單並分析品項中...";

  const base64Image = await new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result.split(',')[1]);
    reader.readAsDataURL(file);
  });

  const promptText = `
你是一個專業的飲料店菜單解析器。請分析這張菜單圖片，只輸出 JSON 格式資料，不要包含任何 Markdown 標記（例如不要寫 \`\`\`json）。
JSON 結構必須為陣列物件，範例如下：
[
  {
    "category": "分類名稱(例如:芝士奶蓋)",
    "items": [
      { "name": "飲料名稱", "M": 中杯價格數字, "L": 大杯價格數字 }
    ]
  }
]
注意事項：
1. 如果沒有區分中大杯，只有一個價格，請讓 M 和 L 的數值相同。
2. 忽略額外說明文字或配料區，專注擷取主要的飲料品項與價格。
3. 價格請直接輸出數字（例如 60）。
`;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: promptText },
            { inline_data: { mime_type: file.type, data: base64Image } }
          ]
        }]
      })
    });

    const resData = await response.json();
    let text = resData.candidates[0].content.parts[0].text.trim();
    
    // 清除可能含有的 markdown JSON 標記
    text = text.replace(/^```json/g, '').replace(/```$/g, '').trim();
    
    const parsedMenu = JSON.parse(text);
    
    // 成功寫入 data 並更新介面
    data.menu = parsedMenu;
    renderDrinkSelect();
    renderEditor();
    
    // 顯示編輯區
    document.getElementById("menuEditor").classList.remove("hidden");
    status.textContent = "✅ AI 辨識完成！菜單選項已自動產出於下方，請點擊「發布今日菜單」。";

  } catch (err) {
    console.error(err);
    status.textContent = "❌ 辨識失敗：請確認 API Key 是否正確或圖片是否清晰。";
  }
}

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const img = document.getElementById("menuPreview");
  img.src = URL.createObjectURL(file);
  img.style.display = "block";
}

/* 介面渲染 */
function renderAll() {
  renderOrderStatus();
  renderDrinkSelect();
  renderPeople();
  renderOrders();
}

function renderOrderStatus() {
  const badge = document.getElementById("statusBadge");
  badge.className = "status " + (data.isOpen ? "open" : "closed");
  badge.textContent = data.isOpen ? "● 訂購中" : "● 已關閉";
  document.getElementById("orderForm").classList.toggle("hidden", !data.isOpen);
  document.getElementById("closedMessage").classList.toggle("hidden", data.isOpen);
}

function renderDrinkSelect() {
  const select = document.getElementById("drinkSelect");
  select.innerHTML = "";

  if (!data.menu || data.menu.length === 0) {
    select.innerHTML = "<option value=''>尚無菜單，請先發布菜單</option>";
    return;
  }

  data.menu.forEach(cat => {
    const group = document.createElement("optgroup");
    group.label = cat.category;
    (cat.items || []).forEach(item => {
      const opt = document.createElement("option");
      opt.value = JSON.stringify({ name: item.name, M: Number(item.M)||0, L: Number(item.L)||0 });
      opt.textContent = `${item.name} (M:$${item.M} / L:$${item.L})`;
      group.appendChild(opt);
    });
    select.appendChild(group);
  });
  updatePrice();
}

function renderEditor() {
  const container = document.getElementById("editorContainer");
  container.innerHTML = "";

  data.menu.forEach((cat, ci) => {
    const box = document.createElement("div");
    box.className = "category-editor";
    box.innerHTML = `
      <div class="category-header">
        <input value="${cat.category}" onchange="data.menu[${ci}].category=this.value">
        <button class="red small" onclick="data.menu.splice(${ci},1);renderEditor();">刪除分類</button>
      </div>
    `;

    cat.items.forEach((item, ii) => {
      const row = document.createElement("div");
      row.className = "drink-editor";
      row.innerHTML = `
        <input value="${item.name}" onchange="data.menu[${ci}].items[${ii}].name=this.value">
        <input type="number" value="${item.M}" onchange="data.menu[${ci}].items[${ii}].M=Number(this.value)">
        <input type="number" value="${item.L}" onchange="data.menu[${ci}].items[${ii}].L=Number(this.value)">
        <button class="red small" onclick="data.menu[${ci}].items.splice(${ii},1);renderEditor();">×</button>
      `;
      box.appendChild(row);
    });

    const addBtn = document.createElement("button");
    addBtn.className = "gray small";
    addBtn.textContent = "＋ 新增飲料";
    addBtn.onclick = () => { cat.items.push({ name: "新飲料", M: 50, L: 60 }); renderEditor(); };
    box.appendChild(addBtn);
    container.appendChild(box);
  });
}

function addCategory() {
  data.menu.push({ category: "新分類", items: [{ name: "新飲料", M: 50, L: 60 }] });
  renderEditor();
}

function toggleEditor() {
  const ed = document.getElementById("menuEditor");
  ed.classList.toggle("hidden");
  if (!ed.classList.contains("hidden")) renderEditor();
}

async function publishMenu() {
  data.shopName = document.getElementById("shopName").value.trim();
  await dbPatch("drinkOrders/" + currentDate, { shopName: data.shopName, menu: data.menu });
  renderDrinkSelect();
  toast("✅ 今日菜單已發布");
}

async function setOrderStatus(isOpen) {
  data.isOpen = isOpen;
  await dbPatch("drinkOrders/" + currentDate, { isOpen: isOpen });
  renderOrderStatus();
}

/* 點餐與金額算計 */
function renderToppings() {
  const container = document.getElementById("toppingList");
  container.innerHTML = "";
  toppings.forEach((top, idx) => {
    const btn = document.createElement("button");
    btn.className = "person-btn small";
    btn.textContent = `${top.name} +$${top.price}`;
    btn.onclick = () => {
      if (selectedToppings.includes(idx)) selectedToppings = selectedToppings.filter(i => i !== idx);
      else selectedToppings.push(idx);
      btn.classList.toggle("selected");
      updatePrice();
    };
    container.appendChild(btn);
  });
}

function updatePrice() {
  const val = document.getElementById("drinkSelect").value;
  if (!val) { document.getElementById("currentPrice").textContent = "$0"; return; }
  const drink = JSON.parse(val);
  const size = document.getElementById("sizeSelect").value;
  let base = size === "M" ? drink.M : drink.L;
  let topCost = selectedToppings.reduce((sum, i) => sum + toppings[i].price, 0);
  document.getElementById("currentPrice").textContent = `$${base + topCost}`;
}

/* 訂單與人員 */
function renderPeople() {
  const container = document.getElementById("peopleList");
  container.innerHTML = "";
  people.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "person-btn" + (selectedName === p ? " selected" : "");
    btn.textContent = p;
    btn.onclick = () => { selectedName = p; renderPeople(); };
    container.appendChild(btn);
  });
}

function addPerson() {
  const name = document.getElementById("newPerson").value.trim();
  if (name && !people.includes(name)) {
    people.push(name);
    selectedName = name;
    document.getElementById("newPerson").value = "";
    renderPeople();
  }
}

async function addOrder() {
  if (!selectedName) { alert("請點選你是「誰」！"); return; }
  const val = document.getElementById("drinkSelect").value;
  if (!val) return;

  const drink = JSON.parse(val);
  const size = document.getElementById("sizeSelect").value;
  const price = (size === "M" ? drink.M : drink.L) + selectedToppings.reduce((s, i) => s + toppings[i].price, 0);

  const item = {
    drink: drink.name, size: size,
    sugar: document.getElementById("sugarSelect").value,
    ice: document.getElementById("iceSelect").value,
    toppings: selectedToppings.map(i => toppings[i].name),
    price: price
  };

  if (!data.orders[selectedName]) data.orders[selectedName] = [];
  data.orders[selectedName].push(item);

  await dbPut("drinkOrders/" + currentDate + "/orders", data.orders);
  toast("已加入訂單！");
  renderOrders();
}

function renderOrders() {
  const container = document.getElementById("ordersContainer");
  container.innerHTML = "";
  let total = 0;

  Object.keys(data.orders || {}).forEach(name => {
    const items = data.orders[name];
    if (!items || items.length === 0) return;

    let pTotal = 0;
    let html = "";
    items.forEach((item, idx) => {
      pTotal += item.price;
      total += item.price;
      const top = item.toppings.length ? ` + ${item.toppings.join(",")}` : "";
      html += `
        <div class="order-item">
          <strong>${item.drink}</strong> (${item.size}) - ${item.sugar}/${item.ice}${top}
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
            <span class="price">$${item.price}</span>
            <button class="red small" onclick="deleteItem('${name}', ${idx})">刪除</button>
          </div>
        </div>
      `;
    });

    const box = document.createElement("div");
    box.className = "order-person";
    box.innerHTML = `<div class="person-header"><span>${name}</span><span>小計: $${pTotal}</span></div>${html}`;
    container.appendChild(box);
  });

  document.getElementById("totalAmount").textContent = `$${total}`;
}

async function deleteItem(name, idx) {
  data.orders[name].splice(idx, 1);
  if (data.orders[name].length === 0) delete data.orders[name];
  await dbPut("drinkOrders/" + currentDate + "/orders", data.orders);
  renderOrders();
}

function generateLineMessage() {
  let msg = `🥤 ${currentDate} ${data.shopName || "飲料店"} 訂購清單\n------------------------\n`;
  let total = 0, count = 0;
  Object.keys(data.orders || {}).forEach(name => {
    (data.orders[name] || []).forEach(item => {
      const top = item.toppings.length ? ` +${item.toppings.join(",")}` : "";
      msg += `【${name}】${item.drink} (${item.size}) ${item.sugar}/${item.ice}${top} $${item.price}\n`;
      total += item.price; count++;
    });
  });
  msg += `------------------------\n共 ${count} 杯，總計 $${total} 元`;
  document.getElementById("lineMessage").value = msg;
  toast("已產生 LINE 訊息");
}

function copyLineMessage() {
  const el = document.getElementById("lineMessage");
  if (!el.value) return alert("請先點擊產生訊息！");
  el.select();
  document.execCommand("copy");
  toast("已複製到剪貼簿！");
}
</script>
