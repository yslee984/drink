/* =====================================================
   基本
===================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: #f5f6f8;
  color: #222;
  font-family:

    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Arial,
    sans-serif;
}

.container {
  max-width: 900px;
  margin: auto;
}

.card {
  background: #fff;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
}

h1 {
  margin: 0;
  font-size: 28px;
}

h2 {
  margin: 0 0 14px;
  font-size: 20px;
}

h3 {
  margin: 0 0 10px;
}

.subtitle {
  margin-top: 6px;
  color: #777;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.field {
  flex: 1;
  min-width: 180px;
}

label {
  display: block;
  font-size: 13px;
  color: #666;
  margin-bottom: 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  background: white;
}

textarea {
  min-height: 180px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 15px;
  background: #222;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button.green {
  background: #2e8b57;
}

button.red {
  background: #d9534f;
}

button.blue {
  background: #3976cf;
}

button.orange {
  background: #df8b00;
}

button.gray {
  background: #eee;
  color: #333;
}

button.small {
  padding: 7px 10px;
  font-size: 13px;
}

button.full {
  width: 100%;
}

.hidden {
  display: none !important;
}


/* =====================================================
   狀態
===================================================== */

.status {
  display: inline-block;
  margin-top: 15px;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
}

.status.open {
  background: #e5f7ed;
  color: #21834b;
}

.status.closed {
  background: #fbe7e7;
  color: #b33c3c;
}


/* =====================================================
   管理區
===================================================== */

.admin {

}

.notice {
  padding: 12px;
  border-radius: 10px;
  background: #fff7dc;
  border: 1px solid #f0dc94;
  color: #735d00;
  font-size: 13px;

.success {
  padding: 12px;
  border-radius: 10px;
  background: #eaf8ef;
  border: 1px solid #b9e4c7;
  color: #25733f;
  font-size: 13px;
}


/* =====================================================
   菜單圖片
===================================================== */

.menu-preview {
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  margin-top: 12px;
  border-radius: 12px;
  background: #f4f4f4;
  display: none;
}


/* =====================================================
   人員
===================================================== */

.people-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.person-btn {
  background: #f1f3f5;
  color: #333;
  border: 1px solid #ddd;
}

.person-btn.selected {
  background: #222;
  color: white;
}


/* =====================================================
   菜單編輯器
===================================================== */

.category-editor {
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}

.category-header {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}

.drink-editor {
  display: grid;

  gap: 6px;
  margin-bottom: 7px;
}

.drink-editor input {
  padding: 8px;
  font-size: 14px;
}


/* =====================================================
   訂單
===================================================== */

}

.order-person:last-child {

}

.person-header {

}

.order-item {

  font-size: 14px;
  line-height: 1.7;
}

.order-actions {
  margin-top: 5px;
}

.price {

.total-box {

  background: #222;
  color: white;
  border-radius: 14px;
}

.total-number {

  font-weight: 700;

/* =====================================================
   Toast
===================================================== */

.toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  background: #222;
  color: white;
  padding: 12px 18px;
  border-radius: 30px;
  font-size: 14px;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
}

.toast.show {

   OCR
===================================================== */

/* =====================================================
   Firebase REST
===================================================== */

function dbUrl(path) {

  return DATABASE_URL +
    "/" +
    path +
    ".json";

}


async function dbGet(path) {

  const response =
    await fetch(
      dbUrl(path),
      {
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      "Firebase 讀取失敗"
    );

  }

  return await response.json();

}


async function dbPut(path, value) {

  const response =
    await fetch(
      dbUrl(path),
      {
        method: "PUT",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(value)
      }
    );

  if (!response.ok) {

    throw new Error(
      "Firebase 寫入失敗"
    );

  }

  return await response.json();

}

    await fetch(
      dbUrl(path),
      {
        method: "PATCH",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(value)
      }
    );

  if (!response.ok) {

    throw new Error(
      "Firebase 更新失敗"
    );

  }

  return await response.json();

}


async function dbDelete(path) {

  const response =
    await fetch(
      dbUrl(path),
      {
        method: "DELETE"
      }
    );

  if (!response.ok) {

    throw new Error(
      "Firebase 刪除失敗"
    );

  }

}

/* =====================================================
   OCR
===================================================== */

async function runOCR() {

  const file =
    document
      .getElementById(
        "menuImage"
      )
      .files[0];


  if (!file) {

    alert(
      "請先選擇菜單圖片。"
    );

    return;

  }


  const status =
    document
      .getElementById(
        "ocrStatus"
      );


  const result =
    document
      .getElementById(
        "ocrResult"
      );


  status.classList.remove(
    "hidden"
  );


  result.classList.remove(
    "hidden"
  );


  status.textContent =
    "🤖 正在辨識菜單，請稍候……";


  result.textContent =
    "";


  try {

    const worker =
      await Tesseract.createWorker(
        "chi_tra+eng"
      );


    const output =
      await worker.recognize(
        file
      );


    const text =
      output.data.text;


    result.textContent =
      text;


    await worker.terminate();


    status.textContent =
      "✅ OCR 辨識完成。請檢查下方文字，再使用「編輯今日菜單」修正菜單。";


  }

  catch(error) {

    console.error(error);

    status.textContent =
      "❌ 辨識失敗，請重新上傳圖片。";

  }

}

      button.textContent =
        topping.name +

      button.onclick =
        function() {

          if (
            selectedToppings
              .includes(index)
          ) {

            selectedToppings =
              selectedToppings
                .filter(
                  function(i) {
                    return i !== index;
                  }
                );


            button.classList.remove(
              "selected"
            );

          }

          else {

            selectedToppings.push(
              index
            );


            button.classList.add(
              "selected"
            );

          }


          updatePrice();

        };


      container.appendChild(
        button
      );

    }
  );

/* =====================================================
   價格
===================================================== */

function getCurrentPrice() {

  const value =
    document
      .getElementById(
        "drinkSelect"
      )
      .value;


  if (!value) return 0;


  const drink =
    JSON.parse(value);


  const size =
    document
      .getElementById(
        "sizeSelect"
      )
      .value;


  let price =
    Number(
      drink[size]
    ) || 0;


  selectedToppings.forEach(
    function(index) {

      price +=
        toppings[index].price;

    }
  );


  return price;

}


function updatePrice() {

  document
    .getElementById(
      "currentPrice"
    )
    .textContent =
    "$" +
    getCurrentPrice();

}

async function loadPeopleFromFirebase() {

  const container =
    document
      .getElementById(
        "peopleList"
      );


  try {

    const result =
      await dbGet(
        "drinkOrderPeople"
      );


    const people =
      result || {};


    container.innerHTML =
      "";


    const names =
      Object.entries(
        people
      );


    if (!names.length) {

      container.innerHTML =
        `
        <div style="color:#999;">
          還沒有訂購人。
        </div>
        `;

      return;

    }


    names.forEach(
      function([id, person]) {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "person-btn";


        if (
          selectedName ===
          person.name
        ) {

          button.classList.add(
            "selected"
          );

        }


        button.textContent =
          person.name;


        button.onclick =
          function() {

            selectedName =
              person.name;


            renderPeople(people);

          };


        button.oncontextmenu =
          async function(event) {

            event.preventDefault();


            if (
              confirm(
                "確定要刪除「" +
                person.name +
                "」嗎？"
              )
            ) {

              await dbDelete(
                "drinkOrderPeople/" +
                id
              );


              loadPeopleFromFirebase();

            }

          };


        container.appendChild(
          button
        );

      }
    );

  }

  catch(error) {

    container.innerHTML =
      `
      <div style="color:#c44;">
        無法讀取共用名單
      </div>
      `;

  }

}

===================================================== */

async function addOrder() {

  if (!data.isOpen) {

    alert(
      "目前已關閉訂購。"
    );

    return;

  }


  if (!selectedName) {

    alert(
      "請先選擇姓名。"
    );

    return;

  }


  const value =
    document
      .getElementById(
        "drinkSelect"
      )
      .value;


  if (!value) {

    alert(
      "請先選擇飲料。"
    );

    return;

  }


  const drink =
    JSON.parse(value);


  const size =
    document
      .getElementById(
        "sizeSelect"
      )
      .value;


  const sugar =
    document
      .getElementById(
        "sugarSelect"
      )
      .value;


  const ice =
    document
      .getElementById(
        "iceSelect"
      )
      .value;


  const toppingNames =
    selectedToppings.map(
      function(index) {
        return toppings[index].name;
      }
    );


  const price =
    getCurrentPrice();


  /*
    每筆訂單都有自己的 ID。

    這是這一版很重要的修改。

    A 點餐與 B 點餐同時發生，
    不會互相覆蓋。
  */

  const orderId =
    "order_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 9);


  const order = {

    name:
      selectedName,

    drink:
      drink.name,

    size:
      size,

    sugar:
      sugar,

    ice:
      ice,

    toppings:
      toppingNames,

    price:
      price,

    createdAt:
      new Date().toISOString()

  };


  try {

    await dbPut(

      "drinkOrders/" +
      currentDate +
      "/orders/" +
      orderId,

      order

    );


    /*
      立即更新畫面
    */

    data.orders[orderId] =
      order;


    renderOrders();


    toast(
      "✅ 已加入 " +
      selectedName +
      " 的訂單"
    );

  }

  catch(error) {

    console.error(error);

    alert(
      "訂單加入失敗，請再試一次。"
    );

  }

}

function renderOrders() {

  const container =
    document
      .getElementById(
        "ordersContainer"
      );

    "";


  const orders =
    Object.entries(
      data.orders || {}
    );

      `

        text-align:center;

      </div>
      `;


    document
      .getElementById(
        "totalAmount"
      )
      .textContent =
      "$0";


    return;

  }


  const grouped = {};


  let total =
    0;


  orders.forEach(
    function([id, order]) {

      if (
        !grouped[
          order.name
        ]
      ) {

        grouped[
          order.name
        ] = [];

      }


      grouped[
        order.name
      ].push({

        id: id,

        ...order

      });


      total +=
        Number(
          order.price
        ) || 0;

    }
  );


  Object.entries(
    grouped
  ).forEach(
    function([name, list]) {

      const box =
        document.createElement(
          "div"
        );


      box.className =
        "order-person";


      const personTotal =
        list.reduce(
          function(sum, order) {

            return sum +
              Number(
                order.price
              ) || 0;

          },
          0
        );


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "person-header";


      header.innerHTML =

        "<span>" +
        escapeHtml(name) +
        "</span>" +

        "<span>$" +
        personTotal +
        "</span>";


      box.appendChild(
        header
      );


      list.forEach(
        function(order) {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "order-item";


          let text =

            escapeHtml(
              order.drink
            ) +

            " ／ " +

            escapeHtml(
              order.size
            ) +

            " ／ " +

            escapeHtml(
              order.sugar
            ) +

            " ／ " +

            escapeHtml(
              order.ice
            );


          if (
            order.toppings &&
            order.toppings.length
          ) {

            text +=
              "<br>加料：" +
              escapeHtml(
                order.toppings.join(
                  "、"
                )
              );

          }


          text +=
            "<br><strong>$" +
            order.price +
            "</strong>";


          text +=
            `
            <div class="order-actions">
              <button
                class="red small"
                onclick="deleteOrder('${order.id}')"
              >
                刪除
              </button>
            </div>
            `;


          item.innerHTML =
            text;


          box.appendChild(
            item
          );

        }
      );


      container.appendChild(
        box
      );

    }
  );


  document
    .getElementById(
      "totalAmount"
    )
    .textContent =
    "$" +
    total;

}


/* =====================================================
   開團／關團
===================================================== */

async function setOrderStatus(
  isOpen
) {

  data.isOpen =
    isOpen;


  try {

    await dbPatch(

      "drinkOrders/" +
      currentDate,

      {
        isOpen:
          isOpen
      }

    );


    renderStatus();


    toast(
      isOpen
        ? "🔓 已開始訂購"
        : "🔒 已關閉訂購"
    );

  }

  catch(error) {

    alert(
      "狀態更新失敗。"
    );

  }

}


function renderStatus() {

  const badge =
    document
      .getElementById(
        "statusBadge"
      );


  const form =
    document
      .getElementById(
        "orderForm"
      );


  const closed =
    document
      .getElementById(
        "closedMessage"
      );


  if (data.isOpen) {

    badge.className =
      "status open";


    badge.textContent =
      "● 訂購中";


    form.classList.remove(
      "hidden"
    );


    closed.classList.add(
      "hidden"
    );

  }

  else {

    badge.className =
      "status closed";


    badge.textContent =
      "● 已關閉";


    form.classList.add(
      "hidden"
    );


    closed.classList.remove(
      "hidden"
    );

  }

}


/* =====================================================
   LINE
===================================================== */

function generateLineMessage() {

  const orders =
    Object.values(
      data.orders || {}
    );


  if (!orders.length) {

    alert(
      "目前沒有訂單。"
    );

    return;

  }


  const grouped = {};


  orders.forEach(
    function(order) {

      if (
        !grouped[
          order.name
        ]
      ) {

        grouped[
          order.name
        ] = [];

      }


      grouped[
        order.name
      ].push(
        order
      );

    }
  );


  let text = "";


  text +=
    "🥤 " +
    data.shopName +
    " 飲料團購\n";


  text +=
    "📅 " +
    currentDate +
    "\n\n";


  Object.entries(
    grouped
  ).forEach(
    function([name, list]) {

      const personTotal =
        list.reduce(
          function(sum, order) {

            return sum +
              Number(
                order.price
              ) || 0;

          },
          0
        );


      text +=
        "【" +
        name +
        "】 $" +
        personTotal +
        "\n";


      list.forEach(
        function(order) {

          text +=
            "・" +
            order.drink +
            " " +
            order.size +
            "／" +
            order.sugar +
            "／" +
            order.ice;


          if (
            order.toppings &&
            order.toppings.length
          ) {

            text +=
              "／加" +
              order.toppings.join(
                "、"
              );

          }


          text +=
            " $" +
            order.price +
            "\n";

        }
      );


      text +=
        "\n";

    }
  );


  const total =
    orders.reduce(
      function(sum, order) {

        return sum +
          Number(
            order.price
          ) || 0;

      },
      0
    );


  text +=
    "💰 總計：$" +
    total;


  document
    .getElementById(
      "lineMessage"
    )
    .value =
    text;

}


async function copyLineMessage() {

  const textarea =
    document
      .getElementById(
        "lineMessage"
      );


  if (!textarea.value) {

    generateLineMessage();

  }


  try {

    await navigator
      .clipboard
      .writeText(
        textarea.value
      );


    toast(
      "📋 已複製，可以貼到 LINE"
    );

  }

  catch(error) {

    textarea.select();

    document.execCommand(
      "copy"
    );


    toast(
      "📋 已複製"
    );

  }

}


/* =====================================================
   全部渲染
===================================================== */

function renderAll() {

  renderStatus();

  renderDrinkSelect();

  renderOrders();

}


/* =====================================================
   工具
===================================================== */

function clone(value) {

  return JSON.parse(
    JSON.stringify(value)
  );

}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function toast(message) {

  const element =
    document
      .getElementById(
        "toast"
      );


  element.textContent =
    message;


  element.classList.add(
    "show"
  );


  setTimeout(
    function() {

      element.classList.remove(
        "show"
      );

    },
    2200
  );

}
