<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥤 飲料團購助手 (看圖自填版)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: #f4f6f8; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; }
    .container { max-width: 800px; margin: auto; }
    .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    h1 { margin: 0; font-size: 24px; }
    h2 { margin: 0 0 12px; font-size: 18px; color: #333; }
    .subtitle { margin-top: 4px; color: #666; font-size: 13px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .field { flex: 1; min-width: 140px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; background: #fff; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; background: #222; color: #fff; font-size: 15px; cursor: pointer; font-weight: bold; }
    button:hover { opacity: .9; }
    button.green { background: #2e8b57; }
    button.red { background: #d9534f; }
    button.blue { background: #3976cf; }
    button.full { width: 100%; }
    
    /* 菜單圖片預覽 */
    .menu-img-container { text-align: center; background: #f9f9f9; border: 2px dashed #ddd; border-radius: 12px; padding: 10px; position: relative; }
    .menu-img { max-width: 100%; max-height: 400px; border-radius: 8px; cursor: zoom-in; object-fit: contain; }
    .zoom-hint { font-size: 12px; color: #888; margin-top: 6px; }

    /* 燈箱 Modal (圖片放大) */
    .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); overflow: auto; justify-content: center; align-items: center; }
    .modal-content { max-width: 95%; max-height: 95vh; object-fit: contain; cursor: zoom-out; border-radius: 8px; }
    .close-modal { position: absolute; top: 15px; right: 20px; color: #fff; font-size: 35px; font-weight: bold; cursor: pointer; }

    /* 人員標籤 */
    .people-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .person-btn { background: #f0f0f0; color: #333; border: 1px solid #ddd; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .person-btn.selected { background: #222; color: white; border-color: #222; }

    /* 訂單明細 */
    .order-person { padding: 12px 0; border-bottom: 1px solid #eee; }
    .person-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 6px; }
    .order-item { padding: 8px 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
    .total-box { margin-top: 15px; padding: 16px; background: #222; color: white; border-radius: 12px; }
    .toast { position: fixed; left: 50%; bottom: 25px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 14px; z-index: 10000; opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; }
  </style>
</head>

<body>
<div class="container">
  <!-- 標頭資訊 -->
  <div class="card">
    <h1>🥤 飲料團購助手</h1>
    <div class="subtitle">看圖點餐 ‧ 自行填寫 ‧ 即時統計</div>
    <div style="height:12px;"></div>
    <div class="row">
      <div class="field">
        <label>店家名稱</label>
        <input id="shopName" placeholder="例如：得正、五十嵐" onchange="updateShopName()">
      </div>
      <div class="field">
        <label>日期</label>
        <input id="orderDate" type="date">
      </div>
    </div>
  </div>

  <!-- 菜單圖片區 -->
  <div class="card">
    <h2>📸 今日菜單 (點擊圖片可放大)</h2>
    <div class="field" style="margin-bottom:10px;">
      <label>上傳/更新菜單圖片：</label>
      <input type="file" id="imageInput" accept="image/*" onchange="uploadMenuImage(this)">
    </div>
    
    <div class="menu-img-container">
      <img id="menuImg" class="menu-img" src="" alt="尚無菜單圖片，請點擊上方上傳" onclick="openZoomModal()">
      <div id="zoomHint" class="zoom-hint">🔍 點擊圖片放大檢視</div>
    </div>
  </div>

  <!-- 點餐人選擇 -->
  <div class="card">
    <h2>👥 1. 選擇點餐人</h2>
    <div class="people-list" id="peopleList"></div>
    <div style="height:12px;"></div>
    <div class="row">
      <div class="field">
        <input id="newPerson" placeholder="輸入同事或朋友姓名">
      </div>
      <button onclick="addPerson()">＋ 新增成員</button>
    </div>
  </div>

  <!-- 自由填寫點餐區 -->
  <div class="card">
    <h2>✍️ 2. 輸入想喝的飲料</h2>
    <div class="row" style="margin-bottom:10px;">
      <div class="field" style="flex:2;">
        <label>飲料品項名稱 *</label>
        <input id="drinkName" placeholder="例如：焙烏龍奶茶">
      </div>
      <div class="field" style="flex:1;">
        <label>價格 ($) *</label>
        <input id="drinkPrice" type="number" placeholder="55">
      </div>
    </div>

    <div class="row" style="margin-bottom:10px;">
      <div class="field">
        <label>容量</label>
        <select id="drinkSize"><option value="L">大杯 (L)</option><option value="M">中杯 (M)</option></select>
      </div>
      <div class="field">
        <label>甜度</label>
        <select id="drinkSugar">
          <option>無糖 (0%)</option><option>微糖 (30%)</option><option>半糖 (50%)</option><option>少糖 (70%)</option><option>正常糖 (100%)</option>
        </select>
      </div>
      <div class="field">
        <label>冰量</label>
        <select id="drinkIce">
          <option>微冰</option><option>去冰</option><option>少冰</option><option>正常冰</option><option>溫</option><option>熱</option>
        </select>
      </div>
    </div>

    <div class="field" style="margin-bottom:12px;">
      <label>加料或備註</label>
      <input id="drinkNote" placeholder="例如：加茶凍 +10、發票分開算">
    </div>

    <button class="green full" onclick="addOrder()">🛒 加入團購清單</button>
  </div>

  <!-- 訂單統計區 -->
  <div class="card">
    <h2>📋 今日訂單明細</h2>
    <div id="ordersContainer"></div>
    <div class="total-box">
      <div>團購總金額</div>
      <div id="totalAmount" style="font-size:32px; font-weight:bold; margin:6px 0;">$0</div>
      <button class="full" onclick="generateLineMessage()">📋 產生 LINE 點餐彙整訊息</button>
    </div>
  </div>

  <!-- LINE 訊息格式 -->
  <div class="card">
    <h2>💬 LINE 點餐訊息</h2>
    <textarea id="lineMessage" rows="5" readonly placeholder="點擊上方按鈕產生複製訊息"></textarea>
    <div style="height:10px;"></div>
    <button class="blue full" onclick="copyLineMessage()">📋 複製到剪貼簿</button>
  </div>
</div>

<!-- 圖片放大 Modal 燈箱 -->
<div id="imageModal" class="modal" onclick="closeZoomModal()">
  <span class="close-modal">&times;</span>
  <img class="modal-content" id="imgModalSrc">
</div>

<div id="toast" class="toast"></div>

<script>
const DATABASE_URL = "https://my-family-calendar-219bb-default-rtdb.firebaseio.com";
let currentDate = "";
let data = { shopName: "", menuImg: "", orders: {} };
let people = ["Alice", "Bob", "Charlie"];
let selectedName = "";

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2000);
}

document.addEventListener("DOMContentLoaded", async function() {
  const today = new Date();
  currentDate = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
  document.getElementById("orderDate").value = currentDate;

  renderPeople();
  await loadToday();
  startSync();
});

/* Firebase API */
function dbUrl(path) { return DATABASE_URL + "/" + path + ".json"; }
async function dbGet(path) { return (await fetch(dbUrl(path), { cache: "no-store" })).json(); }
async function dbPatch(path, val) { return (await fetch(dbUrl(path), { method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify(val) })).json(); }
async function dbPut(path, val) { return (await fetch(dbUrl(path), { method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(val) })).json(); }

async function loadToday() {
  const result = await dbGet("drinkOrdersSelfKey/" + currentDate);
  if (result) {
    data.shopName = result.shopName || "";
    data.menuImg = result.menuImg || "";
    data.orders = result.orders || {};
  }
  document.getElementById("shopName").value = data.shopName;
  if (data.menuImg) {
    document.getElementById("menuImg").src = data.menuImg;
    document.getElementById("zoomHint").style.display = "block";
  } else {
    document.getElementById("zoomHint").style.display = "none";
  }
  renderOrders();
}

function startSync() {
  setInterval(async () => {
    const res = await dbGet("drinkOrdersSelfKey/" + currentDate);
    if (res) {
      if (res.shopName !== undefined) document.getElementById("shopName").value = res.shopName;
      if (res.menuImg && res.menuImg !== data.menuImg) {
        data.menuImg = res.menuImg;
        document.getElementById("menuImg").src = data.menuImg;
        document.getElementById("zoomHint").style.display = "block";
      }
      data.orders = res.orders || {};
      renderOrders();
    }
  }, 4000);
}

/* 店家名稱更新 */
async function updateShopName() {
  data.shopName = document.getElementById("shopName").value.trim();
  await dbPatch("drinkOrdersSelfKey/" + currentDate, { shopName: data.shopName });
}

/* 圖片上傳與放大 */
function uploadMenuImage(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = async function(e) {
      data.menuImg = e.target.result;
      document.getElementById("menuImg").src = data.menuImg;
      document.getElementById("zoomHint").style.display = "block";
      await dbPatch("drinkOrdersSelfKey/" + currentDate, { menuImg: data.menuImg });
      toast("✅ 菜單圖片上傳成功！");
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function openZoomModal() {
  const img = document.getElementById("menuImg");
  if (!img.src || img.src.endsWith(".html")) return;
  document.getElementById("imageModal").style.display = "flex";
  document.getElementById("imgModalSrc").src = img.src;
}

function closeZoomModal() {
  document.getElementById("imageModal").style.display = "none";
}

/* 人員管理 */
function renderPeople() {
  const container = document.getElementById("peopleList");
  container.innerHTML = "";
  people.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "person-btn" + (selectedName === p ? " selected" : "");
    btn.textContent = p;
    btn.onclick = () => { selectedName = p; renderPeople(); };
    container.appendChild(btn);
  });
}

function addPerson() {
  const name = document.getElementById("newPerson").value.trim();
  if (name && !people.includes(name)) {
    people.push(name);
    selectedName = name;
    document.getElementById("newPerson").value = "";
    renderPeople();
  }
}

/* 點餐與訂單管理 */
async function addOrder() {
  if (!selectedName) { alert("請先點選『1. 選擇點餐人』！"); return; }
  const name = document.getElementById("drinkName").value.trim();
  const price = Number(document.getElementById("drinkPrice").value);

  if (!name) { alert("請輸入飲料品項名稱！"); return; }
  if (!price || price <= 0) { alert("請輸入正確的價格！"); return; }

  const item = {
    name: name,
    price: price,
    size: document.getElementById("drinkSize").value,
    sugar: document.getElementById("drinkSugar").value,
    ice: document.getElementById("drinkIce").value,
    note: document.getElementById("drinkNote").value.trim()
  };

  if (!data.orders[selectedName]) data.orders[selectedName] = [];
  data.orders[selectedName].push(item);

  await dbPut("drinkOrdersSelfKey/" + currentDate + "/orders", data.orders);
  toast("✅ 已加入訂單！");
  
  // 清空輸入框
  document.getElementById("drinkName").value = "";
  document.getElementById("drinkPrice").value = "";
  document.getElementById("drinkNote").value = "";
  renderOrders();
}

function renderOrders() {
  const container = document.getElementById("ordersContainer");
  container.innerHTML = "";
  let total = 0;

  Object.keys(data.orders || {}).forEach(name => {
    const items = data.orders[name];
    if (!items || items.length === 0) return;

    let pTotal = 0;
    let html = "";
    items.forEach((item, idx) => {
      pTotal += item.price;
      total += item.price;
      const noteStr = item.note ? ` (${item.note})` : "";
      html += `
        <div class="order-item">
          <div style="display:flex; justify-content:space-between; font-weight:bold;">
            <span>${item.name} (${item.size})</span>
            <span>$${item.price}</span>
          </div>
          <div style="color:#666; font-size:12px; margin-top:2px;">
            ${item.sugar} / ${item.ice}${noteStr}
          </div>
          <div style="text-align:right; margin-top:4px;">
            <button style="background:#d9534f; padding:3px 8px; font-size:12px;" onclick="deleteItem('${name}', ${idx})">刪除</button>
          </div>
        </div>
      `;
    });

    const box = document.createElement("div");
    box.className = "order-person";
    box.innerHTML = `<div class="person-header"><span>${name}</span><span>小計: $${pTotal}</span></div>${html}`;
    container.appendChild(box);
  });

  document.getElementById("totalAmount").textContent = `$${total}`;
}

async function deleteItem(name, idx) {
  data.orders[name].splice(idx, 1);
  if (data.orders[name].length === 0) delete data.orders[name];
  await dbPut("drinkOrdersSelfKey/" + currentDate + "/orders", data.orders);
  renderOrders();
}

function generateLineMessage() {
  let shop = document.getElementById("shopName").value.trim() || "飲料店";
  let msg = `🥤 ${currentDate} 【${shop}】團購清單\n------------------------\n`;
  let total = 0, count = 0;
  
  Object.keys(data.orders || {}).forEach(name => {
    (data.orders[name] || []).forEach(item => {
      const noteStr = item.note ? ` [${item.note}]` : "";
      msg += `【${name}】${item.name} (${item.size}) / ${item.sugar} / ${item.ice}${noteStr} $${item.price}\n`;
      total += item.price;
      count++;
    });
  });
  msg += `------------------------\n共 ${count} 杯，總計 $${total} 元`;
  document.getElementById("lineMessage").value = msg;
  toast("已產生 LINE 訊息！");
}

function copyLineMessage() {
  const el = document.getElementById("lineMessage");
  if (!el.value) return alert("請先點擊產生訊息！");
  el.select();
  document.execCommand("copy");
  toast("已複製到剪貼簿！");
}
</script>
</body>
</html>
